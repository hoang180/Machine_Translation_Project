# ==============================================================================
# Cấu hình siêu tham số (Hyperparameters) cho mô hình Seq2seq LSTM + Attention
# Phụ trách: Hoàng (Phần 2) | Đề tài 8: Dịch máy Anh - Việt
# ==============================================================================

experiment:
  name: "seq2seq-luong-baseline"
  project: "btl-dl-translation-iwslt15"
  seed: 42
  device: "cuda" # 'cuda' hoặc 'cpu'

data:
  train_src: "data/processed/train.en"
  train_tgt: "data/processed/train.vi"
  val_src: "data/processed/tst2012.en"
  val_tgt: "data/processed/tst2012.vi"
  test_src: "data/processed/tst2013.en"
  test_tgt: "data/processed/tst2013.vi"
  max_seq_len: 64
  batch_size: 128
  num_workers: 2

tokenizer:
  type: "word" # Lựa chọn: 'word', 'bpe', hoặc 'spm'
  src_vocab_size: 25000
  tgt_vocab_size: 11838
  pad_idx: 0
  unk_idx: 1
  sos_idx: 2
  eos_idx: 3

model:
  embed_size: 256
  enc_hidden_size: 512
  dec_hidden_size: 512
  num_layers: 2
  dropout: 0.3
  attention_type: "luong" # 'luong' hoặc 'bahdanau'
  luong_method: "general"  # 'general', 'dot', hoặc 'concat'

training:
  epochs: 20
  learning_rate: 0.001
  optimizer: "adam"
  weight_decay: 0.0001
  clip_grad: 1.0 # Gradient clipping chống exploding gradient cho RNN
  teacher_forcing_ratio: 0.5
  teacher_forcing_decay: 0.02 # Giảm dần sau mỗi epoch
  min_teacher_forcing: 0.2
  save_dir: "checkpoints/seq2seq"
  save_best_metric: "val_bleu" # Lưu checkpoint theo val_bleu cao nhất
  patience: 5 # Early stopping nếu sau 5 epoch val_loss/bleu không cải thiện

decoding:
  beam_size: 4
  alpha: 0.6 # Length penalty: ((5 + len) / 6) ^ alpha
  max_len: 60

