# ==============================================================================
# Cấu hình siêu tham số (Hyperparameters) cho Vanilla Transformer from Scratch
# Phụ trách: Sơn (Phần 3) | Đề tài 8: Dịch máy Anh - Việt (IWSLT'15 En-Vi)
# ==============================================================================

experiment:
  name: "transformer-bpe-base"
  project: "btl-dl-translation-iwslt15"
  seed: 42
  device: "cuda" # 'cuda' hoặc 'cpu'

data:
  train_src: "data/processed/train.en"
  train_tgt: "data/processed/train.vi"
  val_src: "data/processed/tst2012.en"
  val_tgt: "data/processed/tst2012.vi"
  test_src: "data/processed/tst2013.en"
  test_tgt: "data/processed/tst2013.vi"
  max_seq_len: 64
  batch_size: 128
  num_workers: 2

tokenizer:
  type: "bpe" # Lựa chọn: 'word', 'bpe', hoặc 'spm'
  src_vocab_size: 16000
  tgt_vocab_size: 16000
  pad_idx: 0
  unk_idx: 1
  sos_idx: 2
  eos_idx: 3

# Cấu hình Base cho IWSLT'15 En-Vi (N=4, H=8, d_model=256, d_ff=1024, use_pe=True)
# Các biến thể Ablation Study chạy bằng ghi đè CLI:
#   - Ablation 2 (N=2):     --num_layers 2
#   - Ablation 3 (H=4):     --num_heads 4
#   - Ablation 4 (no PE):   --use_pe false
#   - Ablation 5 (no LS):   --smoothing 0.0
model:
  d_model: 256
  num_heads: 8
  num_layers: 4
  d_ff: 1024
  dropout: 0.1
  max_len: 512
  use_pe: true
  tie_weights: false

training:
  epochs: 20
  optimizer: "adam"
  beta1: 0.9
  beta2: 0.98
  eps: 1.0e-9
  warmup_steps: 2000
  noam_factor: 1.0
  label_smoothing: 0.1
  clip_grad: 1.0
  gradient_accumulation_steps: 1
  eval_bleu_samples: 200 # Số câu val đánh giá Greedy BLEU mỗi epoch (0 = tắt)
  save_dir: "checkpoints/transformer"
  patience: 5 # Early stopping nếu val_loss không cải thiện sau 5 epochs

decoding:
  beam_size: 4
  alpha: 0.6 # Length penalty: ((5 + len) / 6) ^ alpha
  max_len: 60
